name: Build Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > native_app/android/app/connor-homelab-release.jks
          cat > native_app/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=connor-homelab-release.jks
          EOF

      - name: Build signed release APK
        working-directory: native_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Prepare update manifest
        id: release
        env:
          APK: native_app/build/app/outputs/flutter-apk/app-release.apk
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\)+\(.*\)$/\1/p' native_app/pubspec.yaml)
          VERSION_CODE=$(sed -n 's/^version: [^+]*+\(.*\)$/\1/p' native_app/pubspec.yaml)
          APK_NAME="Connor-Homelab-$VERSION.apk"
          cp "$APK" "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          python3 - <<PY
          import json
          from datetime import datetime, timezone
          manifest = {
            'version': '$VERSION',
            'versionCode': int('$VERSION_CODE'),
            'downloadUrl': 'https://github.com/${{ github.repository }}/releases/download/v$VERSION/$APK_NAME',
            'sha256': '$SHA256',
            'notes': 'Version $VERSION: Android release prepared by GitHub Actions.',
            'publishedAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          with open('app-update.json', 'w') as output:
            json.dump(manifest, output, indent=2)
            output.write('\n')
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-update.json
          git diff --cached --quiet || git commit -m "Publish Connor Homelab v${{ steps.release.outputs.version }}"
          git push

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.release.outputs.tag }}" --title "Connor Homelab ${{ steps.release.outputs.tag }}" --notes "Android release built by GitHub Actions."
          gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.apk }}" --clobber

      - name: Keep a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connor-Homelab-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.apk }}
